services:
  - type: web
    name: aipri-lookbook
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SEED_VERIFIED
        value: "1"
